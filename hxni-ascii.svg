<svg width="259" height="197" viewBox="0 0 259 197"
     xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="wipeClip">
      <rect x="0" y="0" width="0" height="197">
        <animate attributeName="width" from="0" to="259"
                 dur="1.6s" begin="0s" fill="freeze" calcMode="spline"
                 keySplines="0.25 0.1 0.25 1" />
      </rect>
    </clipPath>
    <style>
      .ascii-row {
        fill: #D4AF37;
        font-size: 10.0px;
        letter-spacing: 0.5px;
        white-space: pre;
        opacity: 0;
        animation: fin 0.6s ease-out forwards;
      }
      @keyframes fin {
        from { opacity: 0; transform: translateX(-4px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .term-dot { opacity: 0.9; }
      .term-title {
        fill: #9a9a9a;
        font-size: 12px;
        font-family: 'Fira Code','Consolas',monospace;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="259" height="197" rx="14" ry="14"
        fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1.5" />

  <rect x="0" y="0" width="259" height="34" rx="14" ry="14" fill="#151515" />
  <rect x="0" y="20" width="259" height="14" fill="#151515" />
  <circle class="term-dot" cx="22" cy="17" r="6" fill="#ff5f56" />
  <circle class="term-dot" cx="42" cy="17" r="6" fill="#ffbd2e" />
  <circle class="term-dot" cx="62" cy="17" r="6" fill="#27c93f" />
  <text x="129" y="21" text-anchor="middle" class="term-title">portrait.ascii (placeholder)</text>

  <g clip-path="url(#wipeClip)">
    <text x="24" y="67.5" class="ascii-row" style="animation-delay:0.0s">  ______________________________  </text>
    <text x="24" y="79.0" class="ascii-row" style="animation-delay:0.035s"> /                              \ </text>
    <text x="24" y="90.5" class="ascii-row" style="animation-delay:0.07s">|   [ photo not loaded yet ]     |</text>
    <text x="24" y="102.0" class="ascii-row" style="animation-delay:0.105s">|                                |</text>
    <text x="24" y="113.5" class="ascii-row" style="animation-delay:0.14s">|   run prep_photo.py +          |</text>
    <text x="24" y="125.0" class="ascii-row" style="animation-delay:0.175s">|   make_ascii_svg.py with       |</text>
    <text x="24" y="136.5" class="ascii-row" style="animation-delay:0.21s">|   your real hero.png to        |</text>
    <text x="24" y="148.0" class="ascii-row" style="animation-delay:0.245s">|   generate your portrait       |</text>
    <text x="24" y="159.5" class="ascii-row" style="animation-delay:0.28s">|                                |</text>
    <text x="24" y="171.0" class="ascii-row" style="animation-delay:0.315s"> \______________________________/ </text>
  </g>
</svg>

