<svg width="490" height="430" viewBox="0 0 490 430"
     xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .info-row {
        font-size: 14px;
        opacity: 0;
        animation: fadeUp 0.5s ease-out forwards;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .key { fill: #D4AF37; font-weight: 600; }
      .sep { fill: #6b6b6b; }
      .val { fill: #c9c9c9; }
      .term-title {
        fill: #9a9a9a;
        font-size: 12px;
      }
      .card-title {
        fill: #D4AF37;
        font-size: 16px;
        font-weight: 700;
        opacity: 0;
        animation: fadeUp 0.5s ease-out forwards;
        animation-delay: 0.05s;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="490" height="430" rx="14" ry="14"
        fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1.5" />

  <rect x="0" y="0" width="490" height="34" rx="14" ry="14" fill="#151515" />
  <rect x="0" y="20" width="490" height="14" fill="#151515" />
  <circle cx="22" cy="17" r="6" fill="#ff5f56" />
  <circle cx="42" cy="17" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="17" r="6" fill="#27c93f" />
  <text x="245" y="21" text-anchor="middle" class="term-title">The Cipher Stack</text>

  <text x="26" y="60" class="card-title">The Cipher Stack</text>
  <line x1="26" y1="68" x2="464" y2="68"
        stroke="#2a2a2a" stroke-width="1" />

  <g>
    <text x="26" y="74" class="info-row" style="animation-delay:0.15s"><tspan class="key">OS</tspan><tspan class="sep">  ~  </tspan><tspan class="val">Discord OS</tspan></text>
    <text x="26" y="100" class="info-row" style="animation-delay:0.24s"><tspan class="key">Host</tspan><tspan class="sep">  ~  </tspan><tspan class="val">s.skrt7.workers.dev</tspan></text>
    <text x="26" y="126" class="info-row" style="animation-delay:0.33s"><tspan class="key">Role</tspan><tspan class="sep">  ~  </tspan><tspan class="val">Full Stack Developer • Discord Tooling</tspan></text>
    <text x="26" y="152" class="info-row" style="animation-delay:0.42s"><tspan class="key">Location</tspan><tspan class="sep">  ~  </tspan><tspan class="val">Morocco</tspan></text>
    <text x="26" y="178" class="info-row" style="animation-delay:0.51s"><tspan class="key">Tech Stack</tspan><tspan class="sep">  ~  </tspan><tspan class="val">Cloudflare Workers, JS/HTML/CSS, REST APIs</tspan></text>
    <text x="26" y="204" class="info-row" style="animation-delay:0.6s"><tspan class="key">Socials</tspan><tspan class="sep">  ~  </tspan><tspan class="val">Instagram, Facebook, GitHub</tspan></text>
    <text x="26" y="230" class="info-row" style="animation-delay:0.69s"><tspan class="key">Portfolio</tspan><tspan class="sep">  ~  </tspan><tspan class="val">https://s.skrt7.workers.dev/</tspan></text>
    <text x="26" y="256" class="info-row" style="animation-delay:0.78s"><tspan class="key">GitHub</tspan><tspan class="sep">  ~  </tspan><tspan class="val">github.com/SKRT7-0day</tspan></text>
  </g>
</svg>

